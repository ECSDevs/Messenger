name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build (androidApp + wear + desktop)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Compute version code from commit count
        shell: pwsh
        run: |
          $commitCount = git rev-list --count HEAD
          echo "VERSION_CODE=$commitCount" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          gradle-home-cache-cleanup: true

      - name: Cache Kotlin/Native compiler
        uses: actions/cache@v4
        with:
          path: |
            ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Decode keystore (push builds)
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path keyring | Out-Null
          $keystoreBytes = [Convert]::FromBase64String("${{ secrets.KEYSTORE_BASE64 }}")
          [IO.File]::WriteAllBytes("keyring/messenger-release.jks", $keystoreBytes)

      - name: Build androidApp release APK
        env:
          VERSION_CODE: ${{ env.VERSION_CODE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: pwsh
        run: .\gradlew.bat :androidApp:assembleRelease

      - name: Upload androidApp release artifact
        uses: actions/upload-artifact@v4
        with:
          name: androidApp-release
          path: androidApp/build/outputs/apk/release/androidApp-release.apk

      - name: Build wear release APK
        env:
          VERSION_CODE: ${{ env.VERSION_CODE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: pwsh
        run: .\gradlew.bat :wear:assembleRelease

      - name: Upload wear release artifact
        uses: actions/upload-artifact@v4
        with:
          name: wear-release
          path: wear/build/outputs/apk/release/wear-release.apk

      - name: Build Desktop distribution
        shell: pwsh
        run: .\gradlew.bat :desktopApp:packageReleaseMsi

      - name: List Desktop build outputs (debug path)
        if: always()
        shell: pwsh
        run: |
          $base = "desktopApp\build\compose\binaries"
          if (Test-Path $base) {
            Write-Host "=== $base tree ==="
            Get-ChildItem -Recurse $base | ForEach-Object { $_.FullName }
          } else {
            Write-Host "$base does not exist"
          }

      - name: Upload Desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-msi
          path: |
            desktopApp/build/compose/binaries/main-release/msi/*.msi
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/release/msi/*.msi
            desktopApp/build/compose/binaries/main-release/Msi/*.msi
            desktopApp/build/compose/binaries/main/Msi/*.msi
            desktopApp/build/compose/binaries/release/Msi/*.msi
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest

    steps:
      - name: Download androidApp release artifact
        uses: actions/download-artifact@v4
        with:
          name: androidApp-release
          path: artifacts/androidApp

      - name: Download wear release artifact
        uses: actions/download-artifact@v4
        with:
          name: wear-release
          path: artifacts/wear

      - name: Download Desktop artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-msi
          path: artifacts/desktop-msi

      - name: Get version from tag
        id: get_version
        shell: pwsh
        run: |
          $version = "${{ github.ref }}" -replace 'refs/tags/', ''
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            artifacts/androidApp/androidApp-release.apk
            artifacts/wear/wear-release.apk
            artifacts/desktop-msi/*.msi
