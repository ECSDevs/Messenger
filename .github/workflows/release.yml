name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-all:
    name: Build All
    uses: ./.github/workflows/build-all.yml
    secrets: inherit

  release:
    name: Create GitHub Release
    needs: build-all
    runs-on: ubuntu-latest

    steps:
      - name: Download androidApp release artifact
        uses: actions/download-artifact@v4
        with:
          name: androidApp-release
          path: artifacts/androidApp

      - name: Download wear release artifact
        uses: actions/download-artifact@v4
        with:
          name: wear-release
          path: artifacts/wear

      - name: Download Desktop artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-msi
          path: artifacts/desktop-msi

      - name: Get version from tag
        id: get_version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            artifacts/androidApp/androidApp-release.apk
            artifacts/wear/wear-release.apk
            artifacts/desktop-msi/*.msi
