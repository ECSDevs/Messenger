name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-all:
    name: Build All
    uses: ./.github/workflows/build-all.yml
    secrets: inherit

  release:
    name: Create GitHub Release
    needs: build-all
    runs-on: ubuntu-latest

    steps:
      - name: Download androidApp release artifact
        uses: actions/download-artifact@v4
        with:
          name: androidApp-release
          path: artifacts/androidApp

      - name: Download wear release artifact
        uses: actions/download-artifact@v4
        with:
          name: wear-release
          path: artifacts/wear

      - name: Download runtime release artifact
        uses: actions/download-artifact@v4
        with:
          name: runtime-release
          path: artifacts/runtime

      - name: Download Desktop artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-msi
          path: artifacts/desktop-msi

      - name: Download Web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-distribution
          path: artifacts/web

      - name: Package Web distribution
        run: |
          cd artifacts/web && zip -r ../messenger-web-${GITHUB_REF#refs/tags/}.zip .

      - name: Get version from tag
        id: get_version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      # The tag is the published identity of a release, so it must agree with
      # the VERSION file the artifacts were built from: a `v1.0.1` tag on a
      # tree whose VERSION still says 1.0.0 would ship five clients that all
      # report 1.0.0 under a 1.0.1 release. Fail here instead.
      - name: Verify the tag matches the VERSION file
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          file="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag" != "v$file" ]; then
            echo "::error::Tag '$tag' does not match VERSION '$file' (expected tag 'v$file')."
            echo "Bump the VERSION file and tag the commit that carries it."
            exit 1
          fi
          echo "Tag '$tag' matches VERSION '$file'."

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            artifacts/androidApp/**/*.apk
            artifacts/runtime/**/*.apk
            artifacts/wear/wear-release.apk
            artifacts/desktop-msi/*.msi
            artifacts/messenger-web-*.zip
