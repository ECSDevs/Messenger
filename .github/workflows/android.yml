name: Android CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version info via GitHub API
        run: |
          COMMIT_COUNT=$(curl -s "https://api.github.com/repos/${{ github.repository }}/commits" | jq 'length')
          echo "VERSION_CODE=${COMMIT_COUNT:-1}" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore (push builds)
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p keyring
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keyring/messenger-release.jks

      - name: Build mobile release APK
        env:
          VERSION_CODE: ${{ env.VERSION_CODE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :mobile:assembleRelease

      - name: Build wear release APK
        env:
          VERSION_CODE: ${{ env.VERSION_CODE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :wear:assembleRelease

      - name: Upload mobile release artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-release
          path: mobile/build/outputs/apk/release/mobile-release.apk

      - name: Upload wear release artifact
        uses: actions/upload-artifact@v4
        with:
          name: wear-release
          path: wear/build/outputs/apk/release/wear-release.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download mobile release artifact
        uses: actions/download-artifact@v4
        with:
          name: mobile-release
          path: artifacts/mobile

      - name: Download wear release artifact
        uses: actions/download-artifact@v4
        with:
          name: wear-release
          path: artifacts/wear

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            artifacts/mobile/mobile-release.apk
            artifacts/wear/wear-release.apk