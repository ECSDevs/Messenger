name: Build Web

on:
  workflow_call:

jobs:
  build-web:
    name: Build Web distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Compute version code from commit count
        run: |
          commitCount=$(git rev-list --count HEAD)
          echo "VERSION_CODE=$commitCount" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Rust stable with the wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/rust

      - name: Install wasm-bindgen-cli
        # Must match the wasm-bindgen version resolved in Cargo.lock; the
        # Gradle task invokes `wasm-bindgen` by name.
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          gradle-home-cache-cleanup: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Web distribution
        run: ./gradlew :webApp:wasmJsBrowserDistribution

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-distribution
          path: webApp/build/dist/wasmJs/productionExecutable/**
          if-no-files-found: error
