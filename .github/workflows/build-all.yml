name: Build All

on:
  workflow_call:

jobs:
  build-android:
    name: Build Android
    uses: ./.github/workflows/build-android.yml
    secrets: inherit

  build-wear:
    name: Build Wear
    uses: ./.github/workflows/build-wear.yml
    secrets: inherit

  build-desktop:
    name: Build Desktop
    uses: ./.github/workflows/build-desktop.yml
    secrets: inherit
