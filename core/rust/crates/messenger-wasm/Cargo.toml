[package]
name = "messenger-wasm"
version.workspace = true
edition.workspace = true
description = "wasm-bindgen boundary for the Messenger agent core (browser)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
messenger-core = { path = "../messenger-core" }
messenger-tools = { path = "../messenger-tools" }
messenger-store = { path = "../messenger-store" }
messenger-sync = { path = "../messenger-sync" }
messenger-markdown = { path = "../messenger-markdown" }
messenger-highlight = { path = "../messenger-highlight" }
tokio-util = "0.7"
async-trait = "0.1"

# Excluded on purpose: messenger-ffi (UniFFI has no wasm generator), and
# messenger-mcp (stdio MCP needs child processes the browser cannot spawn).
