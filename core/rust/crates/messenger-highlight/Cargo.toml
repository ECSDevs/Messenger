[package]
name = "messenger-highlight"
version.workspace = true
edition.workspace = true

[dependencies]
# fancy-regex keeps the build pure-Rust (no oniguruma C library) for the
# Android NDK cross targets; highlight quality is identical.
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
