[package]
name = "messenger-tui"
version.workspace = true
edition.workspace = true
description = "Native Rust terminal client for the Messenger agent core (TARGET.md §16/§22)"

[[bin]]
name = "messenger-tui"
path = "src/main.rs"

# The integration tests (`tests/headless.rs`) drive the TUI through the same
# entry points the binary uses, so the crate needs a library target too.
[lib]
name = "messenger_tui"
path = "src/lib.rs"

[dependencies]
messenger-core = { path = "../messenger-core" }
# Decoding `parts_json` needs `messenger_llm::domain::ContentPart`, and the
# provider "fetch models" flow needs `messenger_llm::client::OpenAiClient`.
messenger-llm = { path = "../messenger-llm" }
messenger-store = { path = "../messenger-store" }
messenger-tools = { path = "../messenger-tools" }
messenger-document = { path = "../messenger-document" }
messenger-markdown = { path = "../messenger-markdown" }
messenger-highlight = { path = "../messenger-highlight" }
messenger-sync = { path = "../messenger-sync" }
messenger-mcp = { path = "../messenger-mcp" }
# Implementing `messenger_core::agent::ToolHost` requires the same attribute.
async-trait = "0.1"
# `bracketed-paste` keeps a multi-line paste from being read as one giant
# key press, which the editor would submit as a single message.
crossterm = { version = "0.28", features = ["bracketed-paste"] }
# The widget/terminal layer: `Viewport::Inline` + `Terminal::insert_before`
# (ratatui's own port of the codex scrollback model) keep finalized transcript
# in the terminal's native scrollback, so the widget layer only ever paints
# the bottom chrome.
# `scrolling-regions` is NOT default. Without it ratatui's `insert_before`
# falls back to scrolling the whole screen and REDRAWING the viewport, which
# destroys the very history it was asked to insert (measured: scrollback full
# of blank rows). With it, ratatui restricts the scroll to the region above the
# viewport — the behaviour codex depends on.
# `ratatui-textarea` is deliberately NOT used. It would be the natural editor
# widget, but it exposes no public wrapped-height API (`visual_line_count` and
# friends are internal), so it cannot report how tall the editor needs to be —
# which is exactly what a fixed-height inline viewport needs to know. Writing
# the editor into this crate's own `compose` keeps that height ours, and the
# caret/wrap rules stay pinned by tests.
ratatui = { version = "0.30", features = ["scrolling-regions"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
uuid = { version = "1", features = ["v4"] }
regex = "1"
globset = "0.4"
walkdir = "2"
dirs = "6"
unicode-width = "0.2"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
