[package]
name = "messenger-core"
version.workspace = true
edition.workspace = true

[dependencies]
messenger-llm = { path = "../messenger-llm" }
messenger-store = { path = "../messenger-store" }
messenger-tools = { path = "../messenger-tools" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"

[dev-dependencies]
wiremock = "0.6"
parking_lot = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
