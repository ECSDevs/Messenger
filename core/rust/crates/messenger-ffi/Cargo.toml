[package]
name = "messenger-ffi"
version.workspace = true
edition.workspace = true

[lib]
name = "messenger_ffi"
crate-type = ["lib", "cdylib"]

[dependencies]
# `cli` pulls in the bindgen binary deps (clap/anyhow); the linker strips them
# from the cdylib and release LTO keeps the payload clean. `tokio` wires the
# async runtime for exported async methods.
uniffi = { version = "0.29", features = ["cli", "tokio"] }
messenger-core = { path = "../messenger-core" }
messenger-llm = { path = "../messenger-llm" }
messenger-store = { path = "../messenger-store" }
messenger-tools = { path = "../messenger-tools" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-util = "0.7"
thiserror = "2"
serde_json = "1"
async-trait = "0.1"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
