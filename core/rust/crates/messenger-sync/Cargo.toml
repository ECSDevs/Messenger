[package]
name = "messenger-sync"
version.workspace = true
edition.workspace = true

[dependencies]
messenger-store = { path = "../messenger-store" }
messenger-llm = { path = "../messenger-llm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "js"] }

# Native terminates TLS itself; the wasm backend uses fetch(), so rustls and
# its tokio/hyper stack must stay out of that target's graph.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream"] }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
