[package]
name = "messenger-sync"
version.workspace = true
edition.workspace = true

[dependencies]
messenger-store = { path = "../messenger-store" }
messenger-llm = { path = "../messenger-llm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "fs"] }
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }
